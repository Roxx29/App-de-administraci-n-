name: APK Android

on:
  push:
    paths: ['aplicacion/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para publicar el APK como Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependencias y pruebas
        working-directory: aplicacion
        run: |
          npm ci
          npm test
      - name: Preparar la app móvil
        working-directory: aplicacion/movil
        run: |
          npm ci
          node preparar-www.js
          npx cap sync android
      - name: Compilar APK
        working-directory: aplicacion/movil/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Guarmo-android
          path: aplicacion/movil/android/app/build/outputs/apk/debug/*.apk
      # Descarga directa desde la página de Releases (una por versión de aplicacion/movil/package.json).
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./aplicacion/movil/package.json').version")
          cp aplicacion/movil/android/app/build/outputs/apk/debug/app-debug.apk "Guarmo-$V.apk"
          gh release view "android-v$V" >/dev/null 2>&1 \
            || gh release create "android-v$V" --target "$GITHUB_SHA" --prerelease --title "Guarmo Android $V" --notes "APK de prueba (sin firmar). Instalar permitiendo apps de origen desconocido."
          gh release upload "android-v$V" "Guarmo-$V.apk" --clobber
