name: APK Android

on:
  push:
    paths: ['aplicacion/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependencias y pruebas
        working-directory: aplicacion
        run: |
          npm ci
          npm test
      - name: Preparar la app móvil
        working-directory: aplicacion/movil
        run: |
          npm ci
          node preparar-www.js
          npx cap sync android
      - name: Compilar APK
        working-directory: aplicacion/movil/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ApexLedger-android
          path: aplicacion/movil/android/app/build/outputs/apk/debug/*.apk
